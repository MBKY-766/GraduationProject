<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密封圈缺陷检测系统</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; max-width: 800px; margin: 50px auto; text-align: center; }
        .upload-box { border: 2px dashed #ccc; padding: 50px; margin-top: 30px; }
        #result-area { margin-top: 30px; display: none; }
        #result-img { max-width: 700px; border: 1px solid #eee; margin-top: 20px; }
        .defect-info { margin-top: 20px; font-size: 16px; color: #333; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
<h1>O型密封圈缺陷检测系统</h1>
<div class="upload-box">
    <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.bmp">
    <br><br>
    <button id="detect-btn">上传并检测</button>
</div>

<!-- 检测结果展示区 -->
<div id="result-area">
    <div class="defect-info" id="defect-msg"></div>
    <img id="result-img" src="" alt="检测结果">
</div>

<script>
    // 绑定检测按钮事件
    document.getElementById("detect-btn").addEventListener("click", async function() {
        const fileInput = document.getElementById("file-input");
        const file = fileInput.files[0];
        if (!file) {
            alert("请选择图片文件！");
            return;
        }

        // 构建FormData（上传文件）
        const formData = new FormData();
        formData.append("file", file);

        try {
            // 调用后端检测接口
            const response = await fetch("/api/detect", {
                method: "POST",
                body: formData
            });
            const result = await response.json();

            // 展示结果
            const resultArea = document.getElementById("result-area");
            const defectMsg = document.getElementById("defect-msg");
            const resultImg = document.getElementById("result-img");

            resultArea.style.display = "block";
            if (result.code === 200) {
                // 显示检测结果信息
                if (result.data.has_defect) {
                    let defectList = result.data.defects.map(d =>
                        `${d.class}（置信度：${d.confidence.toFixed(2)}）`
                    ).join("、");
                    defectMsg.innerHTML = `<span class="error">检测到缺陷：${defectList}</span>`;
                } else {
                    defectMsg.innerHTML = `<span class="success">未检测到缺陷，密封圈正常</span>`;
                }
                // 显示带检测框的图片
                resultImg.src = result.data.result_image;
            } else {
                defectMsg.innerHTML = `<span class="error">检测失败：${result.msg}</span>`;
            }
        } catch (e) {
            alert("检测请求失败：" + e.message);
        }
    });
</script>
</body>
</html>
