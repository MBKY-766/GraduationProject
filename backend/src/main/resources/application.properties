spring.application.name=GraduationProject




server.port=8080

server.tomcat.uri-encoding=UTF-8


# AI????
ai.service.url=http://localhost:5000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/seal_detection?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource



mybatis-plus.mapper-locations=classpath:mapper/*.xml

mybatis-plus.type-aliases-package=com.feng.graduationproject.entity

mybatis-plus.configuration.map-underscore-to-camel-case=true

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

mybatis-plus.global-config.db-config.id-type=AUTO



spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=10000ms



spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB



logging.level.com.feng.sealdetectionbackend=DEBUG
logging.level.org.mybatis=DEBUG